# Global Settings
# System-wide configuration for risk, execution, logging, etc.

# Risk Management
risk:
  # Maximum drawdown per trade (3% for intraday)
  max_drawdown_per_trade: 0.03
  
  # Trailing stop ATR multiplier
  trailing_stop_atr_multiplier: 2.0
  
  # Cooldown after stop-loss (number of candles)
  cooldown_candles: 16
  
  # Position sizing
  max_position_size_pct: 1.0  # Max 100% of capital per position
  max_total_exposure_pct: 1.0  # Max 100% total exposure across all positions
  
  # Daily limits (for live trading)
  max_trades_per_day: 20
  max_daily_loss_pct: 0.10  # Stop trading if down 10% in a day

# Execution Settings
execution:
  # Slippage estimate for backtest (0.1%)
  slippage: 0.001
  
  # Trading fees (Binance taker fee: 0.1%)
  taker_fee: 0.001
  maker_fee: 0.001
  
  # Order types
  default_order_type: "market"  # market or limit
  
  # Timeout for order fills (seconds)
  order_timeout: 30
  
  # Retry config
  max_retries: 3
  retry_delay: 1  # seconds

# Data Settings
data:
  # Binance API endpoints
  binance_api_base: "https://api.binance.com"
  
  # Candle fetch limits
  max_candles_per_request: 1000
  historical_lookback_days: 730  # 2 years for backtest
  
  # Cache TTL (seconds)
  cache_ttl: 300  # 5 minutes

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "json"  # json or text
  
  # Structured log fields
  include_timestamp: true
  include_context: true
  
  # Log destinations
  console: true
  file: true
  file_path: "logs/trading.log"
  
  # Rotation
  max_file_size_mb: 100
  backup_count: 10

# Backtest Settings
backtest:
  # Initial capital (USDT)
  initial_capital: 10000
  
  # Benchmark comparison
  benchmark_symbol: "BTCUSDT"
  
  # Reporting
  save_trades: true
  save_equity_curve: true
  save_metrics: true
  
  # Output format
  output_format: "both"  # console, database, or both

# Paper Trading Settings
paper_trading:
  enabled: false
  simulate_slippage: true
  simulate_latency: true
  latency_ms: 100

# Live Trading Settings (Phase 4)
live_trading:
  enabled: false
  
  # Safety checks
  require_manual_approval: true
  max_order_size_usdt: 1000
  
  # Kill switch
  kill_switch_max_drawdown: 0.15  # 15% global drawdown
  
  # Reconciliation
  reconcile_on_startup: true
  reconciliation_interval_hours: 4

# System
system:
  timezone: "UTC"
  environment: "development"  # development, staging, production
