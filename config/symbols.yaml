# Trading Symbols Configuration
# Defines which trading pairs to monitor and trade
#
# Both strategies (smart_hodler + mean_reversion) run on every
# enabled symbol automatically — no per-symbol assignment needed.

symbols:
  - symbol: BTCUSDT
    exchange: binance
    timeframes:
      - 15m
      - 1h
    enabled: true
    description: "Bitcoin / Tether"

  - symbol: ETHUSDT
    exchange: binance
    timeframes:
      - 15m
      - 1h
    enabled: true
    description: "Ethereum / Tether"

  - symbol: SOLUSDT
    exchange: binance
    timeframes:
      - 15m
      - 1h
    enabled: true
    description: "Solana / Tether"

  - symbol: LINKUSDT
    exchange: binance
    timeframes:
      - 15m
      - 1h
    enabled: true
    description: "Chainlink / Tether"

# Add more symbols as needed
# Supported timeframes: 1m, 5m, 15m, 30m, 1h, 4h, 1d, 1w
