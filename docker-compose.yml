services:
  # ── App (dev) ──────────────────────────────────
  app:
    build:
      context: .
      target: dev
    container_name: trade-app
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [dev]
    command: python main.py

  # ── App (prod) ─────────────────────────────────
  app-prod:
    build:
      context: .
      target: prod
    container_name: trade-app
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: [prod]
    command: python main.py

  # ── API (dev) ──────────────────────────────────
  api:
    build:
      context: .
      target: dev
    container_name: trade-api
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/system/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    profiles: [dev]
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  # ── API (prod) ─────────────────────────────────
  api-prod:
    build:
      context: .
      target: prod
    container_name: trade-api
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/system/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    profiles: [prod]
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  # ── Celery Worker ──────────────────────────────
  celery-worker:
    build:
      context: .
      target: dev
    container_name: trade-celery-worker
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [dev]
    command: celery -A core.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app inspect ping --timeout 2"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery-worker-prod:
    build:
      context: .
      target: prod
    container_name: trade-celery-worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: [prod]
    command: celery -A core.celery_app worker --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "celery -A core.celery_app inspect ping --timeout 2"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Celery Beat ────────────────────────────────
  celery-beat:
    build:
      context: .
      target: dev
    container_name: trade-celery-beat
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [dev]
    command: celery -A core.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis, os; r = redis.Redis.from_url(os.environ.get('REDIS_URL', 'redis://redis:6379/0')); assert r.exists('gg:heartbeat:last')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  celery-beat-prod:
    build:
      context: .
      target: prod
    container_name: trade-celery-beat
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: [prod]
    command: celery -A core.celery_app beat --loglevel=info
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis, os; r = redis.Redis.from_url(os.environ.get('REDIS_URL', 'redis://redis:6379/0')); assert r.exists('gg:heartbeat:last')\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ── WebSocket Feed (dev) ────────────────────────
  ws-feed:
    build:
      context: .
      target: dev
    container_name: trade-ws-feed
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [dev]
    restart: unless-stopped
    command: python -m core.data.stream_runner
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis, os; r = redis.Redis.from_url(os.environ.get('REDIS_URL', 'redis://redis:6379/0')); r.ping()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── WebSocket Feed (prod) ───────────────────────
  ws-feed-prod:
    build:
      context: .
      target: prod
    container_name: trade-ws-feed
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: [prod]
    command: python -m core.data.stream_runner
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis, os; r = redis.Redis.from_url(os.environ.get('REDIS_URL', 'redis://redis:6379/0')); r.ping()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Frontend (dev) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: trade-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5858}:5173"
    depends_on:
      api:
        condition: service_healthy
    profiles: [dev]

  # ── Frontend (prod) ────────────────────────────
  frontend-prod:
    build:
      context: ./frontend
      target: prod
    container_name: trade-frontend
    ports:
      - "${FRONTEND_PORT:-5858}:80"
    depends_on:
      api-prod:
        condition: service_healthy
    restart: unless-stopped
    profiles: [prod]

  # ── Postgres ───────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: trade-postgres
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5444}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trade-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
