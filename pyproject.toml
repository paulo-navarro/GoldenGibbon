[project]
name = "trade"
version = "0.1.0"
description = "Crypto quantitative trading platform"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "ta>=0.11,<1",
    "SQLAlchemy>=2.0,<3",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
    "python-binance>=1.0,<2",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.1,<3",
    "pyyaml>=6.0,<7",
    "structlog>=24.1,<25",
    "httpx>=0.27,<1",
    "requests>=2.31,<3",
    "rich>=13.0,<14",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "websockets>=13,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.3,<1",
    "mypy>=1.8,<2",
    "ipython>=8.0,<9",
    "websocket-client>=1.7,<2",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "config*", "api*", "db*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
